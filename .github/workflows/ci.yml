# Pull-request checks. Pages deploy stays in pages.yml.
name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject textbook PDFs
        run: if find . -name '*.pdf' -not -path './node_modules/*' | grep -q .; then echo 'PDF files are not allowed'; find . -name '*.pdf' -not -path './node_modules/*'; exit 1; fi
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Test
        run: npm ci && npm test && npm run build
